[jazzer]
target_class = "OutputFormatFuzzer"
args = "--cp=/out:/out/batik-anim.jar:/out/batik-awt-util.jar:/out/batik-bridge.jar:/out/batik-codec.jar:/out/batik-constants.jar:/out/batik-css.jar:/out/batik-dom.jar:/out/batik-ext.jar:/out/batik-extension.jar:/out/batik-gvt.jar:/out/batik-i18n.jar:/out/batik-parser.jar:/out/batik-script.jar:/out/batik-shared-resources.jar:/out/batik-svg-dom.jar:/out/batik-svggen.jar:/out/batik-transcoder.jar:/out/batik-util.jar:/out/batik-xml.jar:/out/commons-io.jar:/out/commons-logging.jar:/out/fontbox.jar:/out/fop-core.jar:/out/fop-events.jar:/out/fop-util.jar:/out/pdfbox-io.jar:/out/qdox.jar:/out/xml-apis-ext.jar:/out/xml-apis.jar:/out/xmlgraphics-commons.jar -jobs=1000 -workers=4 -rss_limit_mb=4096 /out/corpus-OutputFormatFuzzer"

[swat]
java = "/jdk/bin/java"
swat = "/swat/jar/swat.jar"
args = "-Xmx32g -Djava.library.path=/swat/libs/java-library-path"
jobs = 2

[swat.config]
logging.classes="false"
logging.level="INFO"

instrumentation.transformer="PARAMETER"
instrumentation.parameter.symbolicPattern="OutputFormatFuzzer:fuzzerTestOneInput"
instrumentation.includePackages="OutputFormatFuzzer:org/apache/fop"

solver.solver="(Z3,0.3):(CVC5,0.7)"
solver.timeoutMS="(10000,0.4):(30000,0.4):(60000,0.2)"
solver.solveHidden="(false,0.5):(true,0.5)"
