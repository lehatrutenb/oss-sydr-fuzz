[jazzer]
target_class = "TTFParserFuzzer"
args = "--cp=/out:/out/pdfbox.jar:/out/fontbox.jar:/out/pdfbox-io.jar:/out/log4j-api.jar:/out/log4j-core.jar -dict=/out/pdf.dict -jobs=1000 -workers=4 -rss_limit_mb=4096 /corpus-TTFParserFuzzer"

[swat]
java = "/jdk/bin/java"
swat = "/swat/jar/swat.jar"
args = "-Xmx32g -Djava.library.path=/swat/libs/java-library-path"

[swat.config]
logging.classes="false"
logging.level="INFO"

instrumentation.transformer="PARAMETER"
instrumentation.parameter.symbolicPattern="TTFParserFuzzer:fuzzerTestOneInput"
instrumentation.includePackages="TTFParserFuzzer:org/apache/pdfbox:org/apache/fontbox"

solver.solver="Z3"
solver.timeoutMS="10000"
