[jazzer]
target_class = "TypeFuzzer"
args = "--cp=/out:/out/antlr4-runtime.jar:/out/checker-qual.jar:/out/error_prone_annotations.jar:/out/failureaccess.jar:/out/guava.jar:/out/j2objc-annotations.jar:/out/jakarta.annotation-api.jar:/out/jsr305.jar:/out/trino-grammar.jar:/out/trino-parser.jar -jobs=1000 -workers=4 -rss_limit_mb=4096 /out/corpus-TypeFuzzer"

[swat]
java = "/jdk/bin/java"
swat = "/swat/jar/swat.jar"
args = "-Xmx32g -Djava.library.path=/swat/libs/java-library-path"
jobs = 2

[swat.config]
logging.classes="false"
logging.level="INFO"

instrumentation.transformer="PARAMETER"
instrumentation.parameter.symbolicPattern="TypeFuzzer:fuzzerTestOneInput"
instrumentation.includePackages="TypeFuzzer:io/trino/grammar:io/trino/sql/jsonpath:io/trino/sql/testing"

solver.solver="(Z3,0.3):(CVC5,0.7)"
solver.timeoutMS="(10000,0.4):(30000,0.4):(60000,0.2)"
solver.solveHidden="(false,0.5):(true,0.5)"
